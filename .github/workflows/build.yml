# Builds the Dark's Ride APK on every push to main.
# Push a tag like v1.0 to publish it as a GitHub Release friends can download.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          # Kotlin/Gradle errors as annotations, so they show on the run's summary page.
          grep -E "^e: |What went wrong|error:|Exception" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DarksRide-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "DarksRide-${GITHUB_REF_NAME//\//-}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DarksRide-apk
          path: DarksRide-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DarksRide-*.apk
          generate_release_notes: true

      # A commit on main whose message contains [release] publishes a GitHub Release
      # named after the app's versionName (e.g. v1.0), with the APKs attached.
      - name: Read app version
        id: ver
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "DarksRide-v$v.apk"
      - name: Publish release from main
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dark's Ride ${{ steps.ver.outputs.tag }}
          files: DarksRide-v*.apk
          body: |
            Dark's Ride ${{ steps.ver.outputs.tag }}: companion app linking your main phone (Pocket Sherpa) to the bike phone (Handlebar HQ).

            Install `DarksRide-${{ steps.ver.outputs.tag }}.apk` on both phones, open it, and pick each phone's role.
            Highlights: music, calls and messages on the bike; Send to bike from Google Maps; automatic Bluetooth tethering;
            split screen beside Maps with full-screen music; Glass and Soft styles with 4 ride colours; Garage and encrypted Documents.
          generate_release_notes: true

  # Renders the main screens (portrait, landscape, small screen, split screen; dark and light)
  # to PNGs with Robolectric, to check the layout without a phone. Doesn't block the APK.
  screens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Render screens
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --tests '*LaunchTest*' --stacktrace 2>&1 | tee screens.log
      - name: Show test errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Exception|Caused by" -A3 screens.log | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Publish screens to the "screens" branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r app/build/screens/. /tmp/out/ 2>/dev/null || true
          cp screens.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b screens
          git config user.name "screens-bot"
          git config user.email "screens-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Screens for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens

  # Runs the real release APK on emulators (Android 13 like the LG Wing, and Android 15),
  # opens it as each phone, and publishes screenshots and any crash log to the "emulator" branch.
  emulator:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: /tmp/emu
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/emulator-check.sh
      - name: Publish to the "emulator-<api>" branch
        if: always()
        run: |
          mkdir -p /tmp/emu && cd /tmp/emu
          git init -q -b emulator-${{ matrix.api }}
          git config user.name "emulator-bot"
          git config user.email "emulator-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Emulator run for ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" emulator-${{ matrix.api }}
