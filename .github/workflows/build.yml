# Builds the Dark's Ride APK on every push to main.
# Push a tag like v1.0 to publish it as a GitHub Release friends can download.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          # Kotlin/Gradle errors as annotations, so they show on the run's summary page.
          grep -E "^e: |What went wrong|error:|Exception" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "DarksRide-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DarksRide-apk
          path: DarksRide-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DarksRide-*.apk
          generate_release_notes: true
