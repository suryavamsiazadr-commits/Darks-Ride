# Builds the Dark's Ride APK on every push to main.
# Push a tag like v1.0 to publish it as a GitHub Release friends can download.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          # Kotlin/Gradle errors as annotations, so they show on the run's summary page.
          grep -E "^e: |What went wrong|error:|Exception" -A2 build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "DarksRide-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "DarksRide-${GITHUB_REF_NAME//\//-}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DarksRide-apk
          path: DarksRide-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DarksRide-*.apk
          generate_release_notes: true

  # Renders the main screens (portrait, landscape, small screen, split screen; dark and light)
  # to PNGs with Robolectric, to check the layout without a phone. Doesn't block the APK.
  screens:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Render screens
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest*' --stacktrace 2>&1 | tee screens.log
      - name: Show test errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|FAILED|Exception|Caused by" -A3 screens.log | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - name: Publish screens to the "screens" branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r app/build/screens/. /tmp/out/ 2>/dev/null || true
          cp screens.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b screens
          git config user.name "screens-bot"
          git config user.email "screens-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Screens for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens
