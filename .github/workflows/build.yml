# Builds the Dark's Ride APK on every push to main.
# Push a tag like v1.0 to publish it as a GitHub Release friends can download.
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "DarksRide-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DarksRide-apk
          path: DarksRide-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DarksRide-*.apk
          generate_release_notes: true
